  <text x="600" y="1300" font-family="ui-monospace,'Courier New',monospace" font-size="22" letter-spacing="6" text-anchor="middle" fill="#9aa3b5" fill-opacity="0.8">HUMAN+ &#183; MYTHOS</text>
