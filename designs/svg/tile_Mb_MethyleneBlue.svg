<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <!-- HUMAN+ tile : Methylene Blue -->
  <text x="600" y="190" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="92" font-weight="800"
        text-anchor="middle" letter-spacing="6" fill="#FFFFFF">HUMAN<tspan fill="#7C5CFC">+</tspan></text>
  <text x="600" y="240" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="30" font-weight="700" text-anchor="middle"
        letter-spacing="8" fill="#FFFFFF" fill-opacity="0.75">THE PERIODIC TABLE OF ENHANCEMENT</text>

  <rect x="200" y="360" width="800" height="800" rx="20" fill="none" stroke="#7C5CFC" stroke-width="10"/>
  <line x1="200" y1="530" x2="1000" y2="530" stroke="#7C5CFC" stroke-width="6" stroke-opacity="0.75"/>

  <!-- top-left number (roomy spacing above the divider) -->
  <text x="245" y="462" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="80" font-weight="700" fill="#7C5CFC">320</text>
  <text x="248" y="510" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="30" font-weight="700" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.85">g/mol</text>

  <!-- top-right -->
  <text x="955" y="418" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="32" font-weight="700" letter-spacing="4"
        text-anchor="end" fill="#FFFFFF" fill-opacity="0.85">MOLECULE</text>
  <text x="955" y="480" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="1"
        text-anchor="end" fill="#7C5CFC">C16H18ClN3S</text>

  <!-- giant 2-letter symbol (raised so descenders like p/g/y never hit the name) -->
  <text x="600.0" y="835" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="340" font-weight="800"
        text-anchor="middle" fill="#FFFFFF">Mb</text>

  <!-- full name -->
  <text x="600.0" y="1025" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="74" font-weight="800"
        text-anchor="middle" fill="#7C5CFC">Methylene Blue</text>
  <text x="600.0" y="1072" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85">METHYLTHIONINIUM</text>

  <!-- tagline -->
  <text x="600.0" y="1132" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="33" font-weight="700" letter-spacing="6"
        text-anchor="middle" fill="#FFFFFF">ELECTRON DONOR</text>

  <text x="600" y="1300" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="30" font-weight="700" letter-spacing="4"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7">MODIFIED &#183; ENHANCED &#183; OPTIMIZED</text>
</svg>